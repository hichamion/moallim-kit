<body class="text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-1.5 sm:gap-2">
            <!-- Brand & Current Context -->
            <div class="flex items-center gap-1.5 sm:gap-3 min-w-0 flex-1">
                <button onclick="app.showDashboard()" aria-label="الصفحة الرئيسية" class="flex items-center gap-2.5 text-right group shrink-0">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-graduation-cap text-lg"></i>
                    </div>
                    <div id="brandText"><span class="brand-name">مُعلّم كِت</span></div>
                </button>

                <!-- Breadcrumb when inside a class -->
                <div id="headerBreadcrumb" class="hidden items-center gap-1.5 sm:gap-2 mr-1 sm:mr-2 pr-2 sm:pr-3 border-r border-slate-200 min-w-0">
                    <button onclick="app.showDashboard()" class="text-xs sm:text-sm text-slate-500 hover:text-indigo-600 font-semibold flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-table-cells-large"></i>
                        <span class="hidden md:inline">الحلقات</span>
                    </button>
                    <i class="fa-solid fa-chevron-left text-[10px] text-slate-400"></i>
                    <select id="quickClassSwitcher" aria-label="تبديل الحلقة" onchange="app.openClass(this.value)" class="min-w-0 w-full max-w-[120px] sm:max-w-[280px] truncate bg-slate-100 hover:bg-slate-200/70 text-slate-800 font-bold text-xs sm:text-sm rounded-lg px-2.5 py-1.5 border-0 focus:ring-2 focus:ring-indigo-500 cursor-pointer transition-colors"></select>
                </div>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                <!-- Live Auto-Save & Manual Save Button -->
                <button id="accountBtn" type="button" onclick="app.openAccountModal()" class="account-btn" title="تسجيل الدخول (اختياري)" aria-label="تسجيل الدخول (اختياري)"><i class="fa-solid fa-user"></i></button>

                <div class="theme-switch" role="group" aria-label="المظهر">
                    <button type="button" data-mode="light" onclick="app.chooseTheme('light', event)" aria-label="الوضع النهاري" title="الوضع النهاري"><i class="fa-solid fa-sun"></i><span>نهاري</span></button>
                    <button type="button" data-mode="dark" onclick="app.chooseTheme('dark', event)" aria-label="الوضع الليلي" title="الوضع الليلي"><i class="fa-solid fa-moon"></i><span>ليلي</span></button>
                </div>

                <button onclick="app.showSchedule()" data-nav="schedule" aria-label="الجدول" class="hidden md:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs sm:text-sm font-bold">
                    <i class="fa-regular fa-calendar-days"></i><span>الجدول</span>
                </button>

                <button onclick="app.manualSaveWithFeedback()" title="الحفظ التلقائي مفعل - اضغط للتأكيد الفوري" class="hidden sm:flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 text-xs font-bold transition-all">
                    <i id="saveStatusIcon" class="fa-solid fa-cloud-arrow-up text-emerald-600"></i>
                    <span id="saveStatusText" class="hidden md:inline">محفوظ تلقائياً</span>
                </button>

                <!-- Sound Toggle -->
                <button id="soundToggleBtn" onclick="app.toggleSound()" title="تفعيل/كتم المؤثرات الصوتية" aria-label="تفعيل أو كتم المؤثرات الصوتية" class="hidden sm:flex w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-volume-high text-sm"></i>
                </button>

                <!-- Cloud Sync / Device Export Modal Trigger -->
                <button onclick="app.openSettingsModal()" aria-label="السحابة ونقل البيانات" class="hidden md:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold transition-colors border border-slate-200/60">
                    <i class="fa-brands fa-google-drive text-indigo-600"></i>
                    <span class="hidden sm:inline">السحابة ونقل البيانات</span>
                </button>

                <!-- Add Class Button (Visible on Dashboard) -->
                <button id="headerAddClassBtn" aria-label="حلقة جديدة" onclick="app.openClassModal()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold shadow-sm shadow-indigo-200 transition-all hidden">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">حلقة جديدة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Class Navigation Sub-bar (Visible only when inside a class) -->
    <nav id="classNavBar" aria-label="أقسام الحلقة" class="hidden bg-white border-b border-slate-200 sticky top-16 z-20 no-print shadow-xs overflow-x-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center space-x-1 space-x-reverse py-1.5 min-w-max">
                <button onclick="app.switchTab('seating')" data-tab="seating" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all">
                    <i class="fa-solid fa-mosque"></i>
                    <span id="circleTabName" class="max-w-[160px] truncate">الحلقة</span>
                </button>
                <button onclick="app.startRecite()" data-tab="recite" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all">
                    <i class="fa-solid fa-book-open"></i>
                    <span>جلسة التسميع</span>
                </button>
                <button onclick="app.switchTab('sessions')" data-tab="sessions" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>الحصص</span>
                </button>
                <button onclick="app.switchTab('attendance')" data-tab="attendance" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-user-check"></i>
                    <span>الحضور</span>
                </button>
                <button onclick="app.switchTab('behavior')" data-tab="behavior" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-star"></i>
                    <span>السلوك</span>
                </button>
                <button onclick="app.switchTab('grades')" data-tab="grades" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-award"></i>
                    <span>الاختبارات</span>
                </button>
                <button onclick="app.switchTab('reports')" data-tab="reports" class="class-tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>التقارير</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 print-container">
        
        <!-- VIEW 1: GLOBAL CLASSES DASHBOARD -->
        <section id="dashboardView" class="space-y-6 animate-pop">
            <div id="schoolBuilding"></div>
            <div id="dashboardSummary" class="hidden"></div>

            <!-- Classes Grid Header -->
            <div class="max-w-[980px] mx-auto w-full flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <span id="totalClassesBadge" class="hidden"></span>
                <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="dashboardSearchInput" aria-label="ابحث عن حلقة أو طالب" oninput="app.renderDashboard()" placeholder="ابحث عن حلقة أو طالب..." class="w-full pr-9 pl-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Global Student Search Results (if searching) -->
            <div id="globalStudentSearchResults" class="hidden bg-white rounded-2xl p-4 border border-slate-200 shadow-xs"></div>

            <!-- Classes Cards Grid -->
            <div id="classesGrid" class="stagger grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <!-- VIEW 2: ACTIVE CLASS WORKSPACE -->
        <section id="scheduleView" class="hidden"></section>

        <section id="classWorkspaceView" class="space-y-6 hidden">
            <!-- Class Top Banner -->
            <div id="classHeaderCard" class="no-print"></div>

            <!-- Tab Content Container -->
            <div id="tabContentArea" class="min-h-[420px]"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-12 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-slate-700">مُعلّم كِت (MoallemKit Pro)</span>
                <span>— جميع البيانات تحفظ تلقائياً على جهازك مع دعم المزامنة السحابية ونقل الأجهزة</span>
                <span id="footerSyncBadge" class="inline-flex items-center gap-1 text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full font-bold border border-indigo-200"></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="app.downloadBackupJSON()" class="text-indigo-600 hover:underline font-bold flex items-center gap-1">
                    <i class="fa-solid fa-download"></i>
                    <span>تصدير نسخة لجهاز آخر</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- Phone navigation -->
    <nav id="bottomNav" aria-label="التنقل الرئيسي" class="md:hidden fixed bottom-0 inset-x-0 z-30 border-t border-slate-200 grid grid-cols-3 no-print">
        <button onclick="app.showDashboard()" data-nav="home" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-bold text-indigo-700">
            <i class="fa-solid fa-house text-base"></i><span>الرئيسية</span>
        </button>
        <button onclick="app.showSchedule()" data-nav="schedule" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-bold text-slate-500">
            <i class="fa-regular fa-calendar-days text-base"></i><span>الجدول</span>
        </button>
        <button onclick="app.openSettingsModal()" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-bold text-slate-500">
            <i class="fa-solid fa-gear text-base"></i><span>الإعدادات</span>
        </button>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toastContainer" role="status" aria-live="polite" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none no-print"></div>

    <!-- Universal Modal Backdrop & Wrapper -->
    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 items-center justify-center p-4 overflow-y-auto no-print hidden">
        <div id="modalBox" class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-2xl w-full overflow-hidden animate-pop my-8">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
                <h3 id="modalTitle" class="font-extrabold text-base sm:text-lg text-slate-800"></h3>
                <button onclick="app.closeModal()" aria-label="إغلاق" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modalBody" class="p-5 max-h-[82vh] overflow-y-auto"></div>
        </div>
    </div>
